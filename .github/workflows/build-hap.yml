name: Build HAP

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc bc bison flex libssl-dev \
            libncurses5-dev libelf-dev gcc-aarch64-linux-gnu \
            clang lld llvm make

      - name: Clone Linux kernel v6.12
        run: |
          git clone --depth=1 -b v6.12 https://github.com/torvalds/linux linux

      - name: Download kernel config
        run: |
          cd linux
          curl -fsSL https://raw.githubusercontent.com/harmoninux/linux-config/refs/heads/master/arm64_virt > .config

      - name: Build kernel
        run: |
          cd linux
          export KCFLAGS='-march=armv8.5-a+crc+crypto+lse+rcpc+rng+sm4+sha3+dotprod+fp16 -mtune=neoverse-n1 -O2 -falign-functions=64 -fno-strict-aliasing -mllvm -vectorize-loops -mllvm -force-vector-width=2'
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig
          env KCFLAGS="$KCFLAGS" make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-aarch64
          path: linux/arch/arm64/boot/Image
          retention-days: 30

  build-qemu:
    runs-on: ubuntu-latest
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cmake autotools-dev autoconf automake \
            libtool pkg-config python3 python3-pip flex bison gettext texinfo
          pip3 install --upgrade meson ninja

      - name: Build QEMU and dependencies (aarch64)
        working-directory: deps
        env:
          TOOL_HOME: /opt/harmonyos-tools/command-line-tools
        run: |
          make aarch64

      - name: Upload QEMU libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-libs-aarch64
          path: |
            feature/hish_main/libs/arm64-v8a/
            feature/hish_main/src/main/resources/rawfile/vm/keymaps/
            feature/hish_main/src/main/resources/rawfile/vm/efi-virtio.rom
          retention-days: 30

  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils e2fsprogs

      - name: Download Alpine minirootfs
        run: |
          wget -q https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.1-aarch64.tar.gz
          mkdir alpine
          tar xzf alpine-minirootfs-3.22.1-aarch64.tar.gz -C alpine

      - name: Create rootfs image
        run: |
          qemu-img create -f raw rootfs.img 8G
          mkfs.ext4 rootfs.img
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop rootfs.img /mnt/rootfs
          sudo cp -a alpine/* /mnt/rootfs/
          sudo umount /mnt/rootfs
          qemu-img convert -p -f raw -O qcow2 rootfs.img rootfs_aarch64.qcow2

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-aarch64
          path: rootfs_aarch64.qcow2
          retention-days: 30

  build-hap:
    needs: [build-kernel, build-qemu, build-rootfs]
    runs-on: ubuntu-latest
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-aarch64
          path: feature/hish_main/src/main/resources/rawfile/vm/

      - name: Download QEMU libs artifact
        uses: actions/download-artifact@v4
        with:
          name: qemu-libs-aarch64
          path: ./

      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: rootfs-aarch64
          path: feature/hish_main/src/main/resources/rawfile/vm/

      - name: Rename kernel file
        run: |
          mv feature/hish_main/src/main/resources/rawfile/vm/Image feature/hish_main/src/main/resources/rawfile/vm/kernel_aarch64

      - name: Prepare build profile
        run: |
          cp build-profile.template.json5 build-profile.json5

      - name: Install dependencies
        run: |
          ohpm install --all

      - name: Build phone HAP (debug)
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap \
            --mode module \
            -p product=default \
            -p buildMode=debug \
            --no-daemon 2>&1 | tee build.log

      - name: Get build output path
        id: get_output
        run: |
          OUTPUT_DIR=$(find . -path "*/product/phone/build/default/outputs/default" -type d | head -1)
          if [ -z "$OUTPUT_DIR" ]; then
            OUTPUT_DIR=$(find . -name "*.hap" -exec dirname {} \; | head -1)
          fi
          echo "output_path=$OUTPUT_DIR" >> $GITHUB_OUTPUT
          echo "=== HAP files ==="
          find . -name "*.hap" -type f 2>/dev/null || echo "No HAP found"

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug-hap
          path: |
            ${{ steps.get_output.outputs.output_path }}/*.hap
            build.log
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

  publish:
    needs: build-hap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: phone-debug-hap
          path: ./build-output

      - name: Sign HAP
        id: sign_hap
        if: env.SIGNING_CERT && env.SIGNING_PROFILE && env.SIGNING_KEY
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          HAP_FILE=$(find ./build-output -name "*.hap" | head -1)
          SIGNED_HAP="${HAP_FILE%.hap}-signed.hap"
          java -jar /opt/harmonyos-tools/command-line-tools/sdk/default/openharmony/toolchains/lib/hap-sign-tool.jar \
            sign-app \
            -keyAlias "hish_debug" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -appCertFile "${SIGNING_CERT}" \
            -profileFile "${SIGNING_PROFILE}" \
            -inFile "$HAP_FILE" \
            -keystoreFile "${SIGNING_KEY}" \
            -outFile "$SIGNED_HAP" \
            -keyPwd "${{ secrets.KEY_PASSWORD }}" \
            -keystorePwd "${{ secrets.KEYSTORE_PASSWORD }}" \
            -signCode "1"
          echo "signed_hap=$SIGNED_HAP" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          files: |
            ${{ steps.sign_hap.outcome == 'success' && steps.sign_hap.outputs.signed_hap || './build-output/*.hap' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
