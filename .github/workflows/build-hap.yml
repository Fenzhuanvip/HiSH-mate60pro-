name: Build HAP

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare build profile
        run: |
          cp build-profile.template.json5 build-profile.json5

      - name: Upgrade Hvigor to 6.1.1
        run: |
          # 将容器中 node bin 加入 PATH
          export PATH="/opt/harmonyos-tools/command-line-tools/tool/node/bin:$PATH"
          node --version
          npm --version
          npm install -g @ohos/hvigor@6.1.1 @ohos/hvigor-ohos-plugin@6.1.1 2>&1 || true
          which hvigorw && hvigorw --version 2>&1 || true

      - name: Install dependencies
        run: |
          ohpm install --all

      - name: Build phone HAP (debug)
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap \
            --mode module \
            -p product=default \
            -p buildMode=debug \
            --no-daemon 2>&1 | tee build.log

      - name: Get build output path
        id: get_output
        run: |
          OUTPUT_DIR=$(find . -path "*/product/phone/build/default/outputs/default" -type d | head -1)
          if [ -z "$OUTPUT_DIR" ]; then
            OUTPUT_DIR=$(find . -name "*.hap" -exec dirname {} \; | head -1)
          fi
          echo "output_path=$OUTPUT_DIR" >> $GITHUB_OUTPUT
          echo "=== HAP files ==="
          find . -name "*.hap" -type f 2>/dev/null || echo "No HAP found"

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug-hap
          path: |
            ${{ steps.get_output.outputs.output_path }}/*.hap
            build.log
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: phone-debug-hap
          path: ./build-output

      - name: Sign HAP
        id: sign_hap
        if: env.SIGNING_CERT && env.SIGNING_PROFILE && env.SIGNING_KEY
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          HAP_FILE=$(find ./build-output -name "*.hap" | head -1)
          SIGNED_HAP="${HAP_FILE%.hap}-signed.hap"
          java -jar /harmonyos-tools/command-line-tools/sdk/default/openharmony/toolchains/lib/hap-sign-tool.jar \
            sign-app \
            -keyAlias "hish_debug" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -appCertFile "${SIGNING_CERT}" \
            -profileFile "${SIGNING_PROFILE}" \
            -inFile "$HAP_FILE" \
            -keystoreFile "${SIGNING_KEY}" \
            -outFile "$SIGNED_HAP" \
            -keyPwd "${{ secrets.KEY_PASSWORD }}" \
            -keystorePwd "${{ secrets.KEYSTORE_PASSWORD }}" \
            -signCode "1"
          echo "signed_hap=$SIGNED_HAP" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          files: |
            ${{ steps.sign_hap.outcome == 'success' && steps.sign_hap.outputs.signed_hap || './build-output/*.hap' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
