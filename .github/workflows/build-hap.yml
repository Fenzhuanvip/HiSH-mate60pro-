name: Build HAP (Phone Only)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Cache kernel build
        id: cache-kernel
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: linux/arch/arm64/boot/Image
          key: kernel-v6.12-${{ hashFiles('**/arm64_virt') }}
          restore-keys: |
            kernel-v6.12-

      - name: Install build dependencies
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc bc bison flex libssl-dev \
            libncurses5-dev libelf-dev gcc-aarch64-linux-gnu \
            clang lld llvm make

      - name: Clone Linux kernel v6.12
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: git clone --depth=1 -b v6.12 https://github.com/torvalds/linux linux

      - name: Download kernel config
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: cd linux && curl -fsSL https://raw.githubusercontent.com/harmoninux/linux-config/refs/heads/master/arm64_virt > .config

      - name: Build kernel
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          cd linux
          export KCFLAGS='-march=armv8.5-a+crc+crypto+lse+rcpc+rng+sm4+sha3+dotprod+fp16 -mtune=neoverse-n1 -O2 -falign-functions=64 -fno-strict-aliasing -mllvm -vectorize-loops -mllvm -force-vector-width=2'
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig
          env KCFLAGS="$KCFLAGS" make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Copy kernel Image to workspace root
        run: cp linux/arch/arm64/boot/Image kernel_image

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-aarch64
          # 从 workspace root 上传，纯文件名 kernel_image
          # download-artifact 下载到 vm/ 后为 vm/kernel_image
          # 后面 Rename kernel 步骤改名成 kernel_aarch64
          path: kernel_image
          retention-days: 30

  build-qemu:
    runs-on: ubuntu-latest
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache QEMU build
        id: cache-qemu
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            feature/hish_main/libs/arm64-v8a/
            feature/hish_main/src/main/resources/rawfile/vm/keymaps/
            feature/hish_main/src/main/resources/rawfile/vm/efi-virtio.rom
          key: qemu-aarch64-${{ hashFiles('deps/**') }}

      - name: Check cached QEMU libs
        id: qemu-libs
        run: |
          if [ -f feature/hish_main/libs/arm64-v8a/libqemu-system-aarch64.so ] && \
             [ -f feature/hish_main/libs/arm64-v8a/libqemu-img.so ] && \
             [ -f feature/hish_main/libs/arm64-v8a/libslirp.so ]; then
            echo "hit=true" >> $GITHUB_OUTPUT
            ls -lh feature/hish_main/libs/arm64-v8a/
          else
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "cached QEMU libs missing, will rebuild"
            ls -la feature/hish_main/libs/arm64-v8a/ || true
          fi

      - name: Install QEMU build dependencies
        if: steps.qemu-libs.outputs.hit != 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          exec > >(tee -a "${GITHUB_WORKSPACE}/qemu-deps.log") 2>&1
          apt-get update
          apt-get install -y cmake autotools-dev autoconf automake \
            libtool pkg-config flex bison gettext texinfo curl ca-certificates
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="${HOME}/.local/bin:${PATH}"
          uv python install 3.12
          uv venv /opt/qemu-py --python 3.12
          . /opt/qemu-py/bin/activate
          uv pip install meson ninja
          python3 --version
          command -v python3
          command -v meson
          meson --version
          ninja --version
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          echo "/opt/qemu-py/bin" >> "$GITHUB_PATH"

      - name: Build QEMU and dependencies (aarch64)
        if: steps.qemu-libs.outputs.hit != 'true'
        working-directory: deps
        env:
          TOOL_HOME: /opt/harmonyos-tools/command-line-tools
        run: |
          set -euxo pipefail
          export PATH="/opt/qemu-py/bin:${HOME}/.local/bin:${PATH}"
          python3 --version
          meson --version
          make aarch64 2>&1 | tee "${GITHUB_WORKSPACE}/qemu-build.log"

      - name: Verify QEMU libs copied
        run: |
          test -f feature/hish_main/libs/arm64-v8a/libqemu-system-aarch64.so
          test -f feature/hish_main/libs/arm64-v8a/libqemu-img.so
          test -f feature/hish_main/libs/arm64-v8a/libslirp.so
          ls -lh feature/hish_main/libs/arm64-v8a/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-build-log
          path: |
            qemu-build.log
            qemu-deps.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload QEMU libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-libs-aarch64
          path: |
            feature/hish_main/libs/arm64-v8a/
            feature/hish_main/src/main/resources/rawfile/vm/keymaps/
            feature/hish_main/src/main/resources/rawfile/vm/efi-virtio.rom
          retention-days: 30

  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Cache rootfs build
        id: cache-rootfs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: rootfs_aarch64.qcow2
          key: rootfs-alpine3.22-${{ hashFiles('**/alpine-minirootfs*') }}
          restore-keys: |
            rootfs-alpine3.22-

      - name: Install tools
        if: steps.cache-rootfs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils e2fsprogs

      - name: Download Alpine minirootfs
        if: steps.cache-rootfs.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.1-aarch64.tar.gz
          mkdir alpine
          tar xzf alpine-minirootfs-3.22.1-aarch64.tar.gz -C alpine

      - name: Create rootfs image
        if: steps.cache-rootfs.outputs.cache-hit != 'true'
        run: |
          qemu-img create -f raw rootfs.img 8G
          mkfs.ext4 rootfs.img
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop rootfs.img /mnt/rootfs
          sudo cp -a alpine/* /mnt/rootfs/
          sudo umount /mnt/rootfs
          qemu-img convert -p -f raw -O qcow2 rootfs.img rootfs_aarch64.qcow2

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-aarch64
          path: rootfs_aarch64.qcow2
          retention-days: 30

  build-hap:
    needs: [build-kernel, build-qemu, build-rootfs]
    runs-on: ubuntu-latest
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-aarch64
          path: feature/hish_main/src/main/resources/rawfile/vm/

      - name: Download QEMU libs artifact
        uses: actions/download-artifact@v4
        with:
          name: qemu-libs-aarch64
          path: ./

      - name: Place QEMU libs to correct path
        run: |
          set -eux
          echo "=== artifact layout after download ==="
          ls -lh libs/arm64-v8a || true
          ls -lh src/main/resources/rawfile/vm || true

          if [ ! -f libs/arm64-v8a/libqemu-system-aarch64.so ]; then
            echo "libqemu-system-aarch64.so not found in artifact" >&2
            find . -name 'libqemu-system-aarch64.so' -o -name 'libslirp.so*' | sort
            exit 1
          fi

          if [ -f libs/arm64-v8a/libslirp.so.0 ] && [ ! -f libs/arm64-v8a/libslirp.so ]; then
            cp -v libs/arm64-v8a/libslirp.so.0 libs/arm64-v8a/libslirp.so
          fi

          mkdir -p feature/hish_main/src/main/libs/arm64-v8a
          mkdir -p feature/hish_main/libs/arm64-v8a
          cp -av libs/arm64-v8a/. feature/hish_main/src/main/libs/arm64-v8a/
          cp -av libs/arm64-v8a/. feature/hish_main/libs/arm64-v8a/

          if [ -d src/main/resources/rawfile/vm/keymaps ]; then
            mkdir -p feature/hish_main/src/main/resources/rawfile/vm/keymaps
            cp -av src/main/resources/rawfile/vm/keymaps/. feature/hish_main/src/main/resources/rawfile/vm/keymaps/
          fi
          if [ -f src/main/resources/rawfile/vm/efi-virtio.rom ]; then
            cp -v src/main/resources/rawfile/vm/efi-virtio.rom feature/hish_main/src/main/resources/rawfile/vm/
          fi

      - name: Verify QEMU runtime libs
        run: |
          test -f feature/hish_main/src/main/libs/arm64-v8a/libqemu-system-aarch64.so
          test -f feature/hish_main/src/main/libs/arm64-v8a/libqemu-img.so
          test -f feature/hish_main/src/main/libs/arm64-v8a/libslirp.so
          ls -lh feature/hish_main/src/main/libs/arm64-v8a/

      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: rootfs-aarch64
          path: feature/hish_main/src/main/resources/rawfile/vm/

      - name: Rename kernel file
        run: mv feature/hish_main/src/main/resources/rawfile/vm/kernel_image feature/hish_main/src/main/resources/rawfile/vm/kernel_aarch64

      - name: Cache ohpm dependencies
        id: cache-ohpm
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            oh_modules
            **/oh_modules
          key: ohpm-${{ hashFiles('oh-package-lock.json5') }}
          restore-keys: |
            ohpm-

      - name: Prepare build profile
        run: cp build-profile.template.json5 build-profile.json5

      - name: Install dependencies
        run: ohpm install --all

      - name: Build phone HAP (debug)
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap \
            --mode module \
            -p product=default \
            -p buildMode=debug \
            --no-daemon 2>&1 | tee build.log

      - name: Get build output path
        id: get_output
        run: |
          OUTPUT_DIR=$(find . -path "*/product/phone/build/default/outputs/default" -type d | head -1)
          if [ -z "$OUTPUT_DIR" ]; then
            OUTPUT_DIR=$(find . -name "*.hap" -exec dirname {} \; | head -1)
          fi
          echo "output_path=$OUTPUT_DIR" >> $GITHUB_OUTPUT

      - name: Verify QEMU so packed in HAP
        run: |
          HAP_FILE=$(find . -name "*.hap" | head -1)
          if [ -z "$HAP_FILE" ]; then
            echo "No HAP found" >&2
            exit 1
          fi
          echo "Checking $HAP_FILE"
          # 捕获 unzip 列表一次并忽略 unzip 的非零退出码（如 "extra bytes" 警告）。
          # 否则在 `set -o pipefail` 下 `unzip -l | grep -q` 会因 unzip 非零而误判 missing。
          LISTING="$(unzip -l "$HAP_FILE" 2>/dev/null || true)"
          printf '%s\n' "$LISTING" | grep -E 'libqemu-system-aarch64\.so|libqemu-img\.so|libslirp\.so|libhish_main\.so' || true
          for so in libqemu-system-aarch64.so libqemu-img.so libslirp.so libhish_main.so; do
            if ! grep -q -- "$so" <<<"$LISTING"; then
              echo "$so missing from HAP" >&2
              printf '%s\n' "$LISTING" | grep -E '\.so' || true
              exit 1
            fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hap-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-hap
          path: |
            ${{ steps.get_output.outputs.output_path }}/*.hap
            build.log
          retention-days: 30
